name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-component
            ~/makers
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-component
        run: command -v cargo-component || cargo install cargo-component --locked

      # TODO: drop `--branch` once sevki/makers#687 (node.expand) has merged.
      - name: Install makers (make with the plugin host)
        run: cargo install --git https://github.com/sevki/makers --branch plugin-node-expand make-sys --features wasmtime --bin make --locked --root "$HOME/makers" --force

      - name: Build the plugin components
        run: |
          cargo component build
          cargo component build --features kbuild --target-dir target-kbuild

      - name: Test
        run: MAKERS_MAKE="$HOME/makers/bin/make" cargo test
